[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flight-hunter"
version = "0.1.0"
description = "Search award flight availability on PointsYeah.com"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "pycognito>=2024.5.1",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pyyaml>=6.0",
]

[project.scripts]
flight-hunter = "flight_hunter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false
